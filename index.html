<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arsarazi Ofisi</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

/* HEADER */
header {
  background: #1a1a1a;
  color: white;
  padding: 15px;
  font-size: 20px;
}

/* NAV */
nav {
  display: flex;
  background: #eaeaea;
  border-bottom: 1px solid #ccc;
}

nav button {
  flex: 1;
  padding: 12px;
  border: none;
  background: #eaeaea;
  cursor: pointer;
}

nav button.active {
  background: white;
  border-bottom: 3px solid #1a1a1a;
  font-weight: bold;
}

/* SECTIONS */
section {
  display: none;
  height: calc(100vh - 115px);
}

section.active {
  display: block;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* INFO */
.info-box {
  background: white;
  padding: 20px;
  height: 100%;
  overflow-y: auto;
}

/* GALLERY */
#galeri {
  background: white;
  padding: 10px;
  overflow-y: auto;
}

.gallery-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}

.gallery-container img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.gallery-container img:hover {
  transform: scale(1.05);
}

/* LIGHTBOX */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}

/* CLOSE */
.close-btn {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 32px;
  color: white;
  cursor: pointer;
}

/* COUNTER */
.counter {
  position: absolute;
  bottom: 20px;
  color: white;
  font-size: 14px;
  opacity: 0.9;
}

/* WHATSAPP */
.whatsapp-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  padding: 14px 18px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>

<header>🏠 Arsarazi Ofisi</header>

<nav>
  <button class="active" data-target="tur" onclick="showSection('tur')">360 Tur</button>
  <button data-target="plan" onclick="showSection('plan')">Plan</button>
  <button data-target="bilgi" onclick="showSection('bilgi')">Bilgiler</button>
  <button data-target="galeri" onclick="showSection('galeri')">Galeri</button>
</nav>

<section id="tur" class="active">
  <iframe src="tour/index.html"></iframe>
</section>

<section id="plan">
  <iframe src="https://planner5d.com/view?key=37ed73ce9dc1571cf583cd6be3adbd5e"></iframe>
</section>

<section id="bilgi">
  <div class="info-box">
    <h2>Gayrimenkul Bilgileri</h2>
    <p><b>İlan Sahibi:</b> Arsarazi</p>
    <p><b>Konum:</b> Balıkesir / Paşaalanı</p>
    <p><b>Oda:</b> 3+1</p>
    <p><b>Alan:</b> 120 m²</p>

    <h3>İletişim</h3>
    <p>📞 0501 262 43 26</p>
    <p>📧 keskinrecep26@gmail.com</p>
  </div>
</section>

<section id="galeri">
  <div class="gallery-container"></div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <div class="close-btn" onclick="closeLightbox()">✕</div>
  <img id="lightbox-img">
  <div id="counter" class="counter"></div>
</div>

<a class="whatsapp-btn" href="https://wa.me/905012624326" target="_blank">
  💬 WhatsApp
</a>

<script>
function showSection(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.querySelector(`nav button[data-target="${id}"]`).classList.add("active");
  document.getElementById(id).classList.add("active");
}

/* GALERİ */
const gallery = document.querySelector(".gallery-container");
let photos = [];
let currentIndex = 0;

for (let i = 1; i <= 50; i++) {
  const img = new Image();
  img.src = `photos/${i}.jpg`;

  img.onload = () => {
    photos.push(img.src);
    const thumb = document.createElement("img");
    thumb.src = img.src;
    thumb.onclick = () => openLightbox(photos.indexOf(img.src));
    gallery.appendChild(thumb);
  };
}

/* LIGHTBOX */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const counter = document.getElementById("counter");

function updateCounter() {
  counter.textContent = `${currentIndex + 1} / ${photos.length}`;
}

function openLightbox(index) {
  currentIndex = index;
  lightboxImg.src = photos[currentIndex];
  updateCounter();
  lightbox.style.display = "flex";
}

function closeLightbox() {
  lightbox.style.display = "none";
}

function nextPhoto() {
  currentIndex = (currentIndex + 1) % photos.length;
  lightboxImg.src = photos[currentIndex];
  updateCounter();
}

function prevPhoto() {
  currentIndex = (currentIndex - 1 + photos.length) % photos.length;
  lightboxImg.src = photos[currentIndex];
  updateCounter();
}

/* SWIPE */
let startX = 0;

lightbox.addEventListener("touchstart", e => {
  startX = e.changedTouches[0].screenX;
});

lightbox.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].screenX;
  let diff = startX - endX;
  if (Math.abs(diff) > 50) {
    diff > 0 ? nextPhoto() : prevPhoto();
  }
});

/* ESC */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeLightbox();
});
</script>

</body>
</html>
