<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arsarazi Ofisi</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

header {
  background: #1a1a1a;
  color: white;
  padding: 15px 20px;
  font-size: 20px;
}

nav {
  display: flex;
  background: #eaeaea;
  border-bottom: 1px solid #ccc;
}

nav button {
  flex: 1;
  padding: 12px;
  border: none;
  background: #eaeaea;
  cursor: pointer;
  font-size: 15px;
}

nav button.active {
  background: white;
  border-bottom: 3px solid #1a1a1a;
  font-weight: bold;
}

section {
  display: none;
  height: calc(100vh - 120px);
}

section.active {
  display: block;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.info-box {
  padding: 20px;
  background: white;
  height: 100%;
  overflow-y: auto;
}

.whatsapp-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  padding: 14px 20px;
  border-radius: 50px;
  font-weight: bold;
  text-decoration: none;
  font-size: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  z-index: 9999;
}
</style>
</head>

<body>

<header>🏠 Arsarazi Ofisi</header>

<nav>
  <button class="active" onclick="showSection('tur')">360 Sanal Tur</button>
  <button onclick="showSection('plan')">Plan (2D / 3D)</button>
  <button onclick="showSection('bilgi')">Bilgiler</button>
  <button onclick="showSection('galeri')">Fotoğraflar</button>
</nav>

<!-- 360 TUR -->
<section id="tur" class="active">
  <iframe src="tour/index.html"></iframe>
</section>

<!-- PLAN -->
<section id="plan">
  <iframe src="https://planner5d.com/view?key=37ed73ce9dc1571cf583cd6be3adbd5e"></iframe>
</section>

<!-- BİLGİLER -->
<section id="bilgi">
  <div class="info-box">
    <h2>Gayrimenkul Bilgileri</h2>
    <p><strong>İlan Sahibi:</strong> Arsarazi</p>
    <p><strong>Konum:</strong> Balıkesir / Paşaalanı</p>
    <p><strong>Oda Sayısı:</strong> 3+1</p>
    <p><strong>Metrekare:</strong> 120 m²</p>
    <p><strong>Kat:</strong> 2</p>

    <h3>İletişim</h3>
    <p>📞 Telefon: 0501 262 43 26</p>
    <p>📧 E-Posta: keskinrecep26@gmail.com</p>
    <p>📷 Instagram: @arsarazi</p>
  </div>
</section>

<!-- FOTOĞRAFLAR (PHOTO-PICK) -->
<section id="galeri">
  <iframe src="https://www.photo-pick.com/online/FWvEp6cL.link"></iframe>
</section>

<!-- WhatsApp -->
<a href="https://wa.me/905012624326" target="_blank" class="whatsapp-btn">
  💬 WhatsApp İletişim
</a>

<script>
function showSection(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.querySelector(`nav button[onclick*="${id}"]`).classList.add("active");
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
