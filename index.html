<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arsarazi Ofisi</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;}
header{
  background:#1a1a1a;color:#fff;padding:15px;
  font-size:20px;display:flex;
  align-items:center;justify-content:space-between;
}
.whatsapp-header{
  width:28px;height:28px;cursor:pointer;
  animation:pulse 2s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.15)}
  100%{transform:scale(1)}
}

nav{display:flex;background:#eaeaea;border-bottom:1px solid #ccc;}
nav button{
  flex:1;padding:12px;border:none;
  background:#eaeaea;cursor:pointer;
}
nav button.active{
  background:#fff;
  border-bottom:3px solid #1a1a1a;
  font-weight:bold;
}

section{display:none;height:calc(100vh - 115px);}
section.active{display:block;}
iframe{width:100%;height:100%;border:none;}

.info-box{background:#fff;padding:20px;height:100%;overflow-y:auto;}
.ilan-table{width:100%;border-collapse:collapse;font-size:14px;}
.ilan-table tr{border-bottom:1px solid #eee;}
.ilan-table td{padding:10px 6px;}
.ilan-table td:first-child{color:#666;width:45%;}
.ilan-table td:last-child{font-weight:bold;}

#galeri{background:#fff;padding:10px;overflow-y:auto;}
.gallery-container{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px;
}
.thumb{
  aspect-ratio:4/3;
  background:#ddd;
  border-radius:8px;
  overflow:hidden;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:pointer;
}

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:10px;
}
.close-btn{
  position:absolute;
  top:15px;
  right:20px;
  font-size:32px;
  color:white;
  cursor:pointer;
}
.counter{
  position:absolute;
  bottom:20px;
  color:white;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <div>🏠 Arsarazi Ofisi</div>
  <img src="icons/whatsapp.png" class="whatsapp-header"
       onclick="window.open('https://wa.me/905012624326','_blank')">
</header>

<nav>
  <button class="active" onclick="showSection('tur')">360 Fotoğraf</button>
  <button onclick="showSection('galeri')">Galeri</button>
  <button onclick="showSection('plan')">Plan</button>
  <button onclick="showSection('bilgi')">Bilgiler</button>
  <button onclick="showSection('harita')">Haritalar</button>
</nav>

<section id="tur" class="active">
  <iframe src="tour/index.html"></iframe>
</section>

<section id="galeri">
  <div class="gallery-container" id="gallery"></div>
</section>

<section id="plan">
  <iframe src="https://planner5d.com/view?key=37ed73ce9dc1571cf583cd6be3adbd5e"></iframe>
</section>

<section id="bilgi">
<div class="info-box">
<h2>İlan Bilgileri</h2>
<table class="ilan-table">
<tr><td>İlan Adı</td><td>1.Gündoğan Mah. Seyhan Sok. No:4</td></tr>
<tr><td>Emlak Tipi</td><td>Kiralık Daire</td></tr>
<tr><td>Fiyat</td><td>15.000 TL</td></tr>
<tr><td>m² (Brüt)</td><td>95</td></tr>
<tr><td>Oda</td><td>2+1</td></tr>
<tr><td>Isıtma</td><td>Kombi</td></tr>
</table>
</div>
</section>

<section id="harita">
  <iframe src="https://www.google.com/maps?q=Adana&output=embed"></iframe>
</section>

<div id="lightbox" class="lightbox">
  <div class="close-btn" onclick="closeLightbox()">✕</div>
  <img id="lightboxImg">
  <div id="counter" class="counter"></div>
</div>

<script>
function showSection(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  event.target.classList.add("active");
}

/* GALERİ */
const MAX=30;
const photos=[];
for(let i=1;i<=MAX;i++){
  photos.push({
    thumb:`photos/thumbs/${i}.jpg`,
    large:`photos/large/${i}.jpg`
  });
}

const gallery=document.getElementById("gallery");

photos.forEach((p,i)=>{
  const img=new Image();
  img.src=p.thumb;
  img.onload=()=>{
    const box=document.createElement("div");
    box.className="thumb";
    img.onclick=()=>openLightbox(i);
    box.appendChild(img);
    gallery.appendChild(box);
  };
});

/* LIGHTBOX */
let current=0;
const lb=document.getElementById("lightbox");
const lbImg=document.getElementById("lightboxImg");
const counter=document.getElementById("counter");

function openLightbox(i){
  current=i;
  lbImg.src=photos[current].large;
  counter.textContent=`${current+1} / ${photos.length}`;
  lb.style.display="flex";
}
function closeLightbox(){lb.style.display="none";}

/* SWIPE */
let sx=0;
lb.addEventListener("touchstart",e=>sx=e.touches[0].screenX);
lb.addEventListener("touchend",e=>{
  let d=sx-e.changedTouches[0].screenX;
  if(Math.abs(d)>60){
    current=d>0
      ?(current+1)%photos.length
      :(current-1+photos.length)%photos.length;
    openLightbox(current);
  }
});
</script>

</body>
</html>
