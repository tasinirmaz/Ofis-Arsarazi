<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arsarazi Ofisi</title>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5}

/* HEADER */
header{
  background:#1a1a1a;color:#fff;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.header-left{font-size:20px}
.header-right{
  display:flex;
  align-items:center;
  gap:12px;
}
.icon-btn{
  width:32px;height:32px;
  cursor:pointer;
}
.icon-btn img{width:100%;height:100%}

/* NAV */
nav{display:flex;background:#eaeaea;border-bottom:1px solid #ccc}
nav button{
  flex:1;padding:12px;border:none;
  background:#eaeaea;cursor:pointer
}
nav button.active{
  background:#fff;
  border-bottom:3px solid #1a1a1a;
  font-weight:bold
}

section{display:none;height:calc(100vh - 120px)}
section.active{display:block}
iframe{width:100%;height:100%;border:none}

/* INFO */
.info-box{background:#fff;padding:20px;height:100%;overflow-y:auto}
.ilan-table{width:100%;border-collapse:collapse;font-size:14px}
.ilan-table tr{border-bottom:1px solid #eee}
.ilan-table td{padding:10px 6px}
.ilan-table td:first-child{color:#666;width:45%}
.ilan-table td:last-child{font-weight:bold}

/* GALERİ */
#galeri{background:#fff;padding:10px;overflow-y:auto}
.gallery-container{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:10px
}
.thumb{
  aspect-ratio:4/3;
  background:#ddd;
  border-radius:8px;
  overflow:hidden
}
.thumb img{
  width:100%;height:100%;
  object-fit:cover;
  cursor:pointer;
  opacity:0;
  transition:.3s
}
.thumb.loaded img{opacity:1}

/* LIGHTBOX */
.lightbox{
  display:none;
  position:fixed;inset:0;
  background:rgba(0,0,0,.92);
  justify-content:center;
  align-items:center;
  z-index:9999
}
.lightbox img{max-width:90%;max-height:90%;border-radius:10px}
.close-btn{
  position:absolute;top:15px;right:20px;
  font-size:32px;color:white;cursor:pointer
}
.counter{
  position:absolute;bottom:20px;
  color:white;font-size:14px
}
</style>
</head>

<body>

<header>
  <div class="header-left">🏠 Arsarazi Ofisi</div>

  <div class="header-right">
    <!-- MÜZİK -->
    <div class="icon-btn" onclick="toggleMusic()">
      🎵
    </div>

    <!-- WHATSAPP -->
    <a id="whatsappLink" class="icon-btn" target="_blank">
      <img src="whatsapp.png">
    </a>
  </div>
</header>

<nav>
  <button class="active" onclick="showSection('tur')">360 Tur</button>
  <button onclick="showSection('plan')">Plan</button>
  <button onclick="showSection('bilgi')">Bilgiler</button>
  <button onclick="showSection('galeri')">Galeri</button>
</nav>

<section id="tur" class="active">
  <iframe src="tour/index.html"></iframe>
</section>

<section id="plan">
  <iframe src="https://planner5d.com/view?key=37ed73ce9dc1571cf583cd6be3adbd5e"></iframe>
</section>

<section id="bilgi">
<div class="info-box">
<h2>İlan Bilgileri</h2>

<table class="ilan-table">
<tr><td>İlan Adı</td><td id="ilanAdi">1.Gündoğan Mah. Seyhan Sok. No:4</td></tr>
<tr><td>Emlak Tipi</td><td id="emlakTipi">Kiralık Daire</td></tr>
<tr><td>İlan Tarihi</td><td>15 Aralık 2025</td></tr>
<tr><td>m² (Brüt)</td><td>95</td></tr>
<tr><td>m² (Net)</td><td>85</td></tr>
<tr><td>Oda Sayısı</td><td>2+1</td></tr>
<tr><td>Bina Yaşı</td><td>26-30</td></tr>
<tr><td>Kat</td><td>Giriş</td></tr>
<tr><td>Isıtma</td><td>Kombi</td></tr>
<tr><td>Balkon</td><td>Var</td></tr>
<tr><td>Otopark</td><td>Açık</td></tr>
<tr><td>Aidat</td><td>200 TL</td></tr>
<tr><td>Depozito</td><td>15.000 TL</td></tr>
</table>
</div>
</section>

<section id="galeri">
  <div class="gallery-container"></div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <div class="close-btn" onclick="closeLightbox()">✕</div>
  <img id="lightbox-img">
  <div id="counter" class="counter"></div>
</div>

<!-- MÜZİK -->
<audio id="bgMusic" src="music.mp3" autoplay loop></audio>

<script>
/* TAB */
function showSection(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"))
  document.getElementById(id).classList.add("active")
}

/* WHATSAPP MESAJ */
const ilanAdi=document.getElementById("ilanAdi").innerText
const emlakTipi=document.getElementById("emlakTipi").innerText
const mesaj=`Merhaba, ${ilanAdi} ${emlakTipi} ilanınız ile ilgili bilgi almak istiyorum.`
document.getElementById("whatsappLink").href=
  "https://wa.me/905012624326?text="+encodeURIComponent(mesaj)

/* MÜZİK */
const music=document.getElementById("bgMusic")
function toggleMusic(){
  music.paused ? music.play() : music.pause()
}

/* GALERİ */
const gallery=document.querySelector(".gallery-container")
const photos=[]
for(let i=1;i<=30;i++){
  const img=new Image()
  img.src=`photos/${i}.jpg`
  img.onload=()=>{
    photos.push(img.src)
    const box=document.createElement("div")
    box.className="thumb loaded"
    img.onclick=()=>openLightbox(photos.indexOf(img.src))
    box.appendChild(img)
    gallery.appendChild(box)
  }
}

/* LIGHTBOX */
let currentIndex=0
const lightbox=document.getElementById("lightbox")
const lightboxImg=document.getElementById("lightbox-img")
const counter=document.getElementById("counter")

function openLightbox(i){
  currentIndex=i
  lightboxImg.src=photos[i]
  counter.textContent=`${i+1} / ${photos.length}`
  lightbox.style.display="flex"
}
function closeLightbox(){lightbox.style.display="none"}
</script>

</body>
</html>
