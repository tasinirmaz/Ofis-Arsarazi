<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arsarazi Ofisi</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

/* HEADER */
header {
  background: #1a1a1a;
  color: #fff;
  padding: 15px;
  font-size: 20px;
}

/* NAV */
nav {
  display: flex;
  background: #eaeaea;
  border-bottom: 1px solid #ccc;
}

nav button {
  flex: 1;
  padding: 12px;
  border: none;
  background: #eaeaea;
  cursor: pointer;
  font-size: 14px;
}

nav button.active {
  background: #fff;
  border-bottom: 3px solid #1a1a1a;
  font-weight: bold;
}

/* SECTIONS */
section {
  display: none;
  height: calc(100vh - 115px);
}

section.active {
  display: block;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* INFO */
.info-box {
  background: #fff;
  padding: 20px;
  height: 100%;
  overflow-y: auto;
}

/* GALLERY */
#galeri {
  background: #fff;
  padding: 10px;
  overflow-y: auto;
}

.gallery-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}

.gallery-container img {
  width: 100%;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

.gallery-container img:hover {
  transform: scale(1.05);
}

/* LIGHTBOX */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}

/* WHATSAPP */
.whatsapp-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  padding: 14px 18px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<header>🏠 Arsarazi Ofisi</header>

<nav>
  <button class="active" data-target="tur" onclick="showSection('tur')">360 Tur</button>
  <button data-target="plan" onclick="showSection('plan')">Plan</button>
  <button data-target="bilgi" onclick="showSection('bilgi')">Bilgiler</button>
  <button data-target="galeri" onclick="showSection('galeri')">Galeri</button>
</nav>

<!-- 360 TUR -->
<section id="tur" class="active">
  <iframe src="tour/index.html"></iframe>
</section>

<!-- PLAN -->
<section id="plan">
  <iframe src="https://planner5d.com/view?key=37ed73ce9dc1571cf583cd6be3adbd5e"></iframe>
</section>

<!-- BİLGİ -->
<section id="bilgi">
  <div class="info-box">
    <h2>Gayrimenkul Bilgileri</h2>
    <p><strong>İlan Sahibi:</strong> Arsarazi</p>
    <p><strong>Konum:</strong> Balıkesir / Paşaalanı</p>
    <p><strong>Oda:</strong> 3+1</p>
    <p><strong>Alan:</strong> 120 m²</p>
    <p><strong>Kat:</strong> 2</p>

    <h3>İletişim</h3>
    <p>📞 0501 262 43 26</p>
    <p>📧 keskinrecep26@gmail.com</p>
  </div>
</section>

<!-- GALERİ -->
<section id="galeri">
  <div class="gallery-container"></div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <img id="lightbox-img">
</div>

<a class="whatsapp-btn" target="_blank" href="https://wa.me/905012624326">
  💬 WhatsApp
</a>

<script>
function showSection(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.querySelector(`nav button[data-target="${id}"]`).classList.add("active");
  document.getElementById(id).classList.add("active");
}

/* GALERİ – FETCH YOK */
const gallery = document.querySelector(".gallery-container");

for (let i = 1; i <= 50; i++) {
  const img = document.createElement("img");
  img.src = `photos/${i}.jpg`;
  img.onerror = () => img.remove();
  img.onclick = () => openLightbox(img.src);
  gallery.appendChild(img);
}

/* LIGHTBOX */
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.style.display = "flex";
}

lightbox.onclick = () => {
  lightbox.style.display = "none";
};
</script>

</body>
</html>
