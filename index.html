<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Arsarazi Ofisi</title>

<style>
body{margin:0;font-family:Arial;background:#f5f5f5}
header{
  background:#1a1a1a;color:#fff;
  padding:12px 15px;
  display:flex;align-items:center;justify-content:space-between
}
.header-right{display:flex;gap:12px;align-items:center}
.icon-btn img{width:28px;height:28px;cursor:pointer}

nav{display:flex;background:#eaeaea}
nav button{flex:1;padding:12px;border:none;background:#eaeaea}
nav button.active{background:#fff;border-bottom:3px solid #1a1a1a;font-weight:bold}

section{display:none;height:calc(100vh - 120px)}
section.active{display:block}
iframe{width:100%;height:100%;border:none}

.info-box{background:#fff;padding:20px;height:100%;overflow:auto}
.ilan-table{width:100%;border-collapse:collapse}
.ilan-table td{padding:8px;border-bottom:1px solid #eee}
.ilan-table td:first-child{color:#666;width:45%}

#galeri{background:#fff;padding:10px;overflow:auto}
.gallery-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.thumb{aspect-ratio:4/3;background:#ddd;border-radius:8px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:.3s}
.thumb.loaded img{opacity:1}

.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);justify-content:center;align-items:center;z-index:999}
.lightbox img{max-width:90%;max-height:90%}
.close-btn{position:absolute;top:15px;right:20px;font-size:32px;color:#fff;cursor:pointer}
.counter{position:absolute;bottom:20px;color:#fff}
</style>
</head>

<body>

<header>
  <div>🏠 Arsarazi Ofisi</div>
  <div class="header-right">
    <div class="icon-btn">
      <img src="icons/whatsapp.png" onclick="openWhatsApp()">
    </div>
    <div class="icon-btn">
      <img id="musicIcon" src="icons/music.png" onclick="toggleMusic()">
    </div>
  </div>
</header>

<nav>
  <button class="active" onclick="showSection('tur')">360 Tur</button>
  <button onclick="showSection('plan')">Plan</button>
  <button onclick="showSection('bilgi')">Bilgiler</button>
  <button onclick="showSection('galeri')">Galeri</button>
</nav>

<section id="tur" class="active"><iframe src="tour/index.html"></iframe></section>
<section id="plan"><iframe src="https://planner5d.com/view?key=37ed73ce9dc1571cf583cd6be3adbd5e"></iframe></section>

<section id="bilgi">
<div class="info-box">
<h2>İlan Bilgileri</h2>
<table class="ilan-table">
<tr><td>İlan Adı</td><td id="ilanAdi">1.Gündoğan Mah. Seyhan Sok. No:4</td></tr>
<tr><td>Emlak Tipi</td><td id="emlakTipi">Kiralık Daire</td></tr>
<tr><td>m² (Brüt)</td><td>95</td></tr>
<tr><td>m² (Net)</td><td>85</td></tr>
<tr><td>Oda Sayısı</td><td>2+1</td></tr>
<tr><td>Bina Yaşı</td><td>26-30</td></tr>
<tr><td>Kat</td><td>Giriş</td></tr>
<tr><td>Isıtma</td><td>Kombi</td></tr>
<tr><td>Balkon</td><td>Var</td></tr>
<tr><td>Aidat</td><td>200 TL</td></tr>
<tr><td>Depozito</td><td>15.000 TL</td></tr>
</table>
</div>
</section>

<section id="galeri"><div class="gallery-container"></div></section>

<div class="lightbox" id="lightbox">
  <div class="close-btn" onclick="closeLightbox()">✕</div>
  <img id="lightboxImg">
  <div class="counter" id="counter"></div>
</div>

<audio id="bgMusic" src="music/bg.mp3" loop></audio>

<script>
function showSection(id){
 document.querySelectorAll("section").forEach(s=>s.classList.remove("active"))
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"))
 document.getElementById(id).classList.add("active")
 event.target.classList.add("active")
}

/* WhatsApp */
function openWhatsApp(){
 const ilan=document.getElementById("ilanAdi").innerText
 const tip=document.getElementById("emlakTipi").innerText
 const msg=`Merhaba,%0A${ilan} ${tip} ilanınız ile ilgili bilgi almak istiyorum.`
 window.open(`https://wa.me/905012624326?text=${msg}`,'_blank')
}

/* Müzik */
const music=document.getElementById("bgMusic")
let playing=true

document.body.addEventListener("click",()=>{
 if(!playing){
  music.play()
  playing=true
 }
},{once:true})

function toggleMusic(){
 if(music.paused){music.play()}else{music.pause()}
}
</script>

</body>
</html>
